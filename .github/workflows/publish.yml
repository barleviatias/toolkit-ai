name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  # id-token: npm OIDC trusted publishing.
  # contents: write so we can create a GitHub Release with the bundled asset.
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm test
      - run: npm publish

      # Attach the bundled .mjs to a GitHub Release so the curl|sh installer
      # in install.sh can fetch it without going through npm. Idempotent:
      # if a release for the tag already exists (e.g. created manually via
      # the GitHub UI or `gh release create`), upload the asset to it
      # instead of failing the workflow.
      - name: Create or update GitHub Release with bundled asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Install without npm: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash\`"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists — uploading asset (--clobber) and refreshing notes."
            gh release upload "${GITHUB_REF_NAME}" bin/ai-toolkit.mjs --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes "${NOTES}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "${NOTES}" \
              bin/ai-toolkit.mjs
          fi
